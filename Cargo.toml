[package]
name = "regf"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
authors = ["Tony Su"]
description = "A Rust library for parsing, manipulating, and writing Windows Registry hive files (regf format)"
license = "MIT"
repository = "https://github.com/peitaosu/regf"
keywords = ["windows", "registry", "regf", "hive", "forensics"]
categories = ["parsing", "filesystem"]

[dependencies]
thiserror = "2"
byteorder = "1"
chrono = { version = "0.4", features = ["std"] }
bitflags = "2"
encoding_rs = "0.8"
tempfile = "3"

[dev-dependencies]
hex = "0.4"

[features]
default = []
serde = ["dep:serde"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

